name: Update Chrome Root Store

on:
  schedule:
    # Every Monday at 11:23 Asia/Shanghai (03:23 UTC).
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-chrome-root-store
  cancel-in-progress: false

jobs:
  update:
    name: Verify and propose signed component update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Unix Makefiles
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      UPDATE_BRANCH: automation/chromium-root-store-update
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Download and verify the latest PKI Metadata component
        run: cargo run --locked -p chromium-crs -- update

      - name: Detect Root Store changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            chromium-crs/data/crs.pb \
            chromium-crs/data/SOURCE.toml \
            chromium-roots/src/generated.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting
        if: steps.changes.outputs.changed == 'true'
        run: cargo fmt --all --check

      - name: Check workspace
        if: steps.changes.outputs.changed == 'true'
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        if: steps.changes.outputs.changed == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        if: steps.changes.outputs.changed == 'true'
        run: cargo test --workspace --locked

      - name: Check the signed component snapshot
        if: steps.changes.outputs.changed == 'true'
        run: cargo run --locked -p chromium-crs -- check

      - name: Check the publishable package
        if: steps.changes.outputs.changed == 'true'
        run: cargo package --locked --allow-dirty -p chromium-roots

      - name: Run the btls integration example
        if: steps.changes.outputs.changed == 'true'
        run: cargo run --locked -p chromium-roots --example btls

      - name: Commit update and open pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          paths=(
            chromium-crs/data/crs.pb
            chromium-crs/data/SOURCE.toml
            chromium-roots/src/generated.rs
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true

          if git rev-parse --verify --quiet \
              "refs/remotes/origin/$UPDATE_BRANCH" >/dev/null &&
            git diff --quiet "refs/remotes/origin/$UPDATE_BRANCH" -- "${paths[@]}"; then
            echo "The update branch already contains the current generated files."
          else
            git switch --create "$UPDATE_BRANCH"
            git add -- "${paths[@]}"
            git diff --cached --check
            git commit -m "chore: update Chrome Root Store"
            gh auth setup-git
            git push --force-with-lease --set-upstream origin "$UPDATE_BRANCH"
          fi

          pr_url="$(
            gh pr list \
              --base "$DEFAULT_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [[ -z "$pr_url" ]]; then
            body_file="$RUNNER_TEMP/chromium-root-store-update.md"
            {
              echo "This automated PR updates the checked-in Chrome Root Store snapshot from the"
              echo "signed Chromium PKI Metadata component."
              echo
              echo "The update workflow verified the CRX3 signature and pinned component identity,"
              echo "regenerated the Rust source, ran formatting, workspace checks, Clippy, tests,"
              echo "the snapshot consistency check, package verification, and the btls integration"
              echo "example."
              echo
              echo "Review chromium-crs/data/SOURCE.toml and the generated certificate changes"
              echo "before merging."
            } > "$body_file"
            pr_url="$(
              gh pr create \
                --base "$DEFAULT_BRANCH" \
                --head "$UPDATE_BRANCH" \
                --title "chore: update Chrome Root Store" \
                --body-file "$body_file"
            )"
          fi

          {
            echo "## Chrome Root Store update proposed"
            echo
            echo "Created or updated [$pr_url]($pr_url)."
            echo "Review the signed source metadata and generated certificate diff before merging."
          } >> "$GITHUB_STEP_SUMMARY"
