name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    name: GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.7

      - name: Test release commit guard
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

  msrv:
    needs: workflows
    name: Rust 1.98
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Check minimum supported Rust version
        run: cargo check --workspace --all-targets --locked

  rust:
    needs: msrv
    name: Rust stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check formatting
        run: cargo +nightly fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Check documentation
        run: cargo doc --workspace --no-deps --locked

      - name: Check the locked snapshot and generated source
        run: cargo run --locked -p chromium-crs -- check

      - name: Check the publishable package
        run: cargo package --locked -p chromium-roots

  btls-example:
    needs: rust
    name: btls integration example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Unix Makefiles
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run the API overview example
        run: cargo run --locked -p chromium-roots --example api_overview

      - name: Run the btls integration example
        run: cargo run --locked -p chromium-roots --example btls
