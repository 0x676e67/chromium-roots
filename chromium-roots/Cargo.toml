[package]
name = "chromium-roots"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
description = "A maintainable Rust snapshot of the Chromium Root Store"
documentation = "https://docs.rs/chromium-roots"
repository = { workspace = true }
readme = "README.md"
license = { workspace = true }
keywords = ["chromium", "certificate", "root-store", "tls", "webpki"]
categories = ["cryptography", "web-programming"]
include = [
    "src/**",
    "tests/**",
    "examples/btls.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHROMIUM_LICENSE",
]

[dependencies]
rustls-pki-types = { workspace = true }
btls = { version = "=0.5.6", optional = true }
btls-sys = { version = "=0.5.6", optional = true }

[dev-dependencies]
webpki = { workspace = true }
x509-parser = { workspace = true }

[features]
btls-example = ["dep:btls", "dep:btls-sys"]

[[example]]
name = "btls"
required-features = ["btls-example"]

[lints]
workspace = true
